version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: feature-toggle-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: feature_toggle_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - feature-toggle-dev-network

  redis:
    image: redis:7-alpine
    container_name: feature-toggle-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - feature-toggle-dev-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: feature-toggle-app-dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: feature_toggle_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-secret-key
      API_KEY_SECRET: dev-api-key-secret
      LOG_LEVEL: debug
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - ./node_modules:/app/node_modules
    depends_on:
      - postgres
      - redis
    command: npm run dev
    networks:
      - feature-toggle-dev-network

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  feature-toggle-dev-network:
    driver: bridge

